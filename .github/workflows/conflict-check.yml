name: PR Merge Status with Badge Alerts

on:
  pull_request:
    branches:
      - main

jobs:
  check-merge-status:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main

      - name: Check for merge conflicts
        id: merge_check
        run: |
          if git merge --no-commit --no-ff origin/main; then
            echo "mergeable=true" >> $GITHUB_OUTPUT
          else
            echo "mergeable=false" >> $GITHUB_OUTPUT
          fi

      - name: Post merge status comment with badge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            let body = '';
            if (steps.merge_check.outputs.mergeable === 'true') {
              body = `
> ![success]
> **Branch is applicable to merge by QUDDUS or Owners**
`;
            } else {
              body = `
> ![warning]
> This PR cannot be merged cleanly into \`main\`.
> Please resolve all conflicts.
`;
            }

            // Check for existing bot comment
            const comments = await github.issues.listComments({
              owner,
              repo,
              issue_number: pull_number
            });

            const existing = comments.data.find(c => c.user.type === 'Bot' && 
              (c.body.includes('Ready to Merge') || c.body.includes('Merge Conflicts')));

            if (existing) {
              // Update existing comment
              await github.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              // Create new comment
              await github.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: body
              });
            }