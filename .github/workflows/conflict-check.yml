name: Check Branch Conflicts

on:
  pull_request:
    branches:
      - main

jobs:
  check-conflicts:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main

      - name: Check for merge conflicts with main
        id: merge_check
        run: |
          git merge --no-commit --no-ff origin/main || exit 1

      - name: Request changes and reviewers if conflicts are detected
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            // Request changes review
            await github.pulls.createReview({
              owner,
              repo,
              pull_number,
              event: "REQUEST_CHANGES",
              body: `
              > ![warning](https://img.shields.io/badge/⚠️-Warning-red) **Merge Conflicts Detected**
              > This PR cannot be merged cleanly into `main`.
              > Please resolve all conflicts.
              `
            });

            // Request review from repository owners
            await github.pulls.requestReviewers({
              owner,
              repo,
              pull_number,
              reviewers: [
                "quddus-larik"
              ]
            });
